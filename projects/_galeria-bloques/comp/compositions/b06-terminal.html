<!doctype html>
<!--
  bm-block: terminal
  Uso: un comando real tipeándose + su salida. Ideal para CLIs, instalaciones, demos de dev tools.
  REGLA: comando y salida reales (copiados de una corrida). Ocultá tokens, paths personales y datos de clientes.
  "output": líneas separadas por \n; una línea que empieza con "✓" se pinta como éxito.
  Los defaults son placeholders visibles (⟦…⟧): si no los reemplazás, se ven en pantalla y --strict frena el final.
  Duración sugerida: 1.2 s + largo del comando/28 + 0.25 s por línea de salida + 1.5 s.
-->
<html
  lang="es"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Título de la ventana","default":"terminal","maxLength":40},
    {"id":"prompt","type":"string","label":"Prompt","default":"$","maxLength":12},
    {"id":"command","type":"string","label":"Comando","default":"echo \"reemplazar por una corrida real\"","maxLength":120},
    {"id":"output","type":"string","label":"Salida (\\n entre líneas)","default":"⟦COMPLETAR: pegá la salida real de esa corrida⟧","maxLength":600},
    {"id":"caption","type":"string","label":"Leyenda (opcional)","default":"","maxLength":90},
    {"id":"exit","type":"enum","label":"Salida","default":"fade","options":[{"value":"none","label":"Corte"},{"value":"fade","label":"Fade"},{"value":"up","label":"Hacia arriba"}]},
    {"id":"dur","type":"number","label":"Duración de la escena (s)","default":6,"min":1,"max":30,"step":0.1,"unit":"s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>terminal</title>
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; container-type: size; }
        #root .tm { display: flex; flex-direction: column; justify-content: center; gap: calc(4cqmin * var(--look-space)); }
        #root .tm-win { background: var(--c-code-background); border: var(--stroke) solid var(--c-code-line); border-radius: var(--radius-md); overflow: hidden; }
        #root .tm-bar { display: flex; align-items: center; gap: 1.2cqmin; padding: 1.6cqmin 2.2cqmin; border-bottom: var(--stroke) solid var(--c-code-line); }
        #root .tm-dot { width: 1.3cqmin; height: 1.3cqmin; border-radius: 50%; background: var(--c-code-line); }
        #root .tm-title { margin-left: 1.2cqmin; font-family: var(--font-mono); font-size: var(--fs-label); color: var(--c-code-chrome); }
        #root .tm-body { --code-avail: 80cqw; padding: 3cqmin 3.4cqmin; min-height: 30cqmin; color: var(--c-code-text); font-size: max(2.2cqmin, min(var(--fs-code), calc(var(--code-avail) / (var(--code-chars, 40) * 0.61)))); }
        /* con el piso de 2,2cqmin una línea muy larga no se achica ilegible: se parte (build:roots avisa si pasa de 40/56) */
        #root .tm-cmdline { display: flex; gap: 1.6cqmin; white-space: pre; }
        #root .tm-cmdline > span:last-child { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        #root .tm-prompt { color: var(--c-secondary); }
        #root .tm-caret { display: inline-block; width: 0.55em; height: 1.1em; vertical-align: -0.15em; background: var(--c-text); margin-left: 0.1em; }
        #root .tm-out { margin-top: 2cqmin; color: var(--c-code-chrome); white-space: pre-wrap; }
        #root .tm-out .ok { color: var(--c-success); }
        @container (orientation: portrait) { #root .tm-body { --code-avail: 68cqw; } }
      </style>
      <div id="root" data-composition-id="b06-terminal">
        <div class="bm-frame">
          <div class="bm-bg"></div>
          <div class="bm-safe tm">
            <div class="tm-win">
              <div class="tm-bar"><span class="tm-dot"></span><span class="tm-dot"></span><span class="tm-dot"></span><span class="tm-title"></span></div>
              <div class="tm-body bm-code">
                <div class="tm-cmdline"><span class="tm-prompt"></span><span><span class="tm-cmd"></span><span class="tm-caret"></span></span></div>
                <div class="tm-out"></div>
              </div>
            </div>
            <p class="bm-h3 tm-cap" style="text-align: var(--look-text-align)"></p>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = BM.vars({ title: "", prompt: "$", command: "", output: "", caption: "", exit: "fade", dur: 6 }, window.__hyperframes);
          var q = function (s) { return root.querySelector(s); };
          q(".tm-title").textContent = v.title;
          q(".tm-prompt").textContent = v.prompt;
          var out = q(".tm-out");
          var longest = [String(v.prompt) + " " + String(v.command)].concat(String(v.output).replace(/\\n/g, "\n").split("\n")).reduce(function (m, l) { return Math.max(m, l.length); }, 30);
          q(".tm-body").style.setProperty("--code-chars", longest);
          var outLines = String(v.output).replace(/\\n/g, "\n").split("\n").filter(function (s) { return s.length; }).map(function (s) {
            var d = document.createElement("div");
            d.textContent = s;
            if (/^\s*[✓✔]/.test(s)) d.className = "ok";
            out.appendChild(d);
            return d;
          });
          var cap = q(".tm-cap");
          var capLines = v.caption ? BM.lines(cap, v.caption) : (cap.remove(), []);

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".tm-win"), { opacity: 0, yPercent: 4 }, { opacity: 1, yPercent: 0, duration: BRAND.dur("enter"), ease: BRAND.ease("enter") }, 0.1);
          var t0 = 0.6;
          BM.typeText(tl, q(".tm-cmd"), v.command, t0, 30);
          var typed = t0 + String(v.command).length / 30;
          // caret: parpadeo determinista (keyframes en la timeline, no CSS animation)
          var caret = q(".tm-caret");
          for (var t = 0; t < Number(v.dur); t += 1.0) {
            if (t > t0 && t < typed) continue;
            tl.set(caret, { opacity: 0 }, t + 0.5);
            tl.set(caret, { opacity: 1 }, t + 1.0);
          }
          tl.set(caret, { opacity: 0 }, typed + 0.3);
          tl.fromTo(outLines, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.28 }, typed + 0.35);
          if (capLines.length) BM.revealLines(tl, capLines, typed + 0.35 + outLines.length * 0.28);
          BM.exit(tl, q(".tm"), Number(v.dur) - BRAND.dur("exit") - 0.05, v.exit);
          window.__timelines["b06-terminal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
