<!doctype html>
<!--
  bm-block: producto-video
  Uso: un tramo de video real del producto (en uso, en la mano, girando) a pantalla completa, con un movimiento de cámara suave y, como mucho, una etiqueta corta. Le da realidad a una pieza de producto o e-commerce (Reels, TikTok, Mercado Libre); para fotos, `producto`.
  El video de la escena va en comp/assets/video/<id-de-la-escena>.mp4 (p. ej. s03-mate.mp4) y se registra en PROVENANCE.md. Si falta, `hyperframes lint` frena con missing_local_asset.
  Puede ser la toma entera: `mediaStart` elige el segundo donde arranca el tramo y la escena dura lo que dice scenes.json. Va sin sonido (la voz y los efectos van en el audio de la pieza).
  Los videos de celular (HEVC, a veces HDR) conviene pasarlos antes a H.264 SDR, p. ej.:
    ffmpeg -i IMG.MOV -vf "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=hable,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,scale=-2:1920" -r 30 -an -c:v libx264 -crf 18 comp/assets/video/s03-mate.mp4
  (si la toma es SDR, alcanza con -vf "scale=-2:1920,format=yuv420p").
  Duración sugerida: 1.5-3 s por tramo (ritmo dinámico); con etiqueta, al menos BRAND.hold(etiqueta) + 0.8 s.
-->
<html
  lang="es"
  data-composition-variables='[
    {"id":"mediaStart","type":"number","label":"Segundo del video donde arranca el tramo","default":0,"min":0,"max":3600,"step":0.1,"unit":"s"},
    {"id":"focus","type":"string","label":"Punto de interés (object-position, p. ej. 50% 40%)","default":"50% 50%","maxLength":20},
    {"id":"move","type":"enum","label":"Movimiento de cámara","default":"push-in","options":[{"value":"push-in","label":"Acercar"},{"value":"pull-out","label":"Alejar"},{"value":"pan-up","label":"Subir"},{"value":"pan-down","label":"Bajar"},{"value":"none","label":"Quieta"}]},
    {"id":"amount","type":"number","label":"Intensidad del movimiento (escala)","default":0.05,"min":0,"max":0.25,"step":0.01},
    {"id":"entry","type":"enum","label":"Entrada","default":"snap","options":[{"value":"snap","label":"Golpe de zoom corto (dinámico)"},{"value":"fade","label":"Fundido"},{"value":"cut","label":"Corte seco"}]},
    {"id":"label","type":"string","label":"Etiqueta (opcional, 1-3 palabras, acento con *)","default":"","maxLength":28},
    {"id":"labelPos","type":"enum","label":"Posición de la etiqueta","default":"top","options":[{"value":"top","label":"Arriba"},{"value":"bottom","label":"Abajo (fuera de la zona de UI en vertical)"}]},
    {"id":"exit","type":"enum","label":"Salida","default":"none","options":[{"value":"none","label":"Corte"},{"value":"fade","label":"Fade"},{"value":"up","label":"Hacia arriba"}]},
    {"id":"dur","type":"number","label":"Duración de la escena (s)","default":2.4,"min":0.5,"max":20,"step":0.1,"unit":"s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>producto-video</title>
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; container-type: size; overflow: hidden; }
        #root .pv-stage { position: absolute; inset: 0; overflow: hidden; background: var(--c-surface); }
        #root .pv-media { position: absolute; inset: 0; transform-origin: var(--pv-origin, 50% 50%); will-change: transform; }
        #root .pv-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #root .pv-ui { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        #root .pv-ui.bottom { justify-content: flex-end; }
        #root .pv-label { background: var(--c-background); color: var(--c-text); border-radius: var(--radius-md);
          padding: calc(1.4cqmin * var(--look-space)) calc(2.8cqmin * var(--look-space)); text-align: center; max-width: 86%; }
      </style>
      <div id="root" data-composition-id="__ID__">
        <div class="bm-frame">
          <!-- el <video> va escrito en el HTML (no creado por script) para que HyperFrames lo ubique en el tiempo de la escena -->
          <div class="pv-stage"><div class="pv-media"><video id="__ID__-video" src="assets/video/__ID__.mp4" data-start="0" muted playsinline></video></div></div>
          <div class="bm-safe pv-ui"><div class="pv-label bm-h3"></div></div>
        </div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = BM.vars({ mediaStart: 0, focus: "50% 50%", move: "push-in", amount: 0.05, entry: "snap", label: "", labelPos: "top", exit: "none", dur: 2.4 }, window.__hyperframes);
          var q = function (s) { return root.querySelector(s); };
          var media = q(".pv-media");
          var dur = Number(v.dur);
          var amt = Math.max(0, Math.min(0.25, Number(v.amount)));

          // el tramo: desde mediaStart, lo que dure la escena. HyperFrames maneja la reproducción (nunca play/seek acá).
          var vid = q("video");
          vid.setAttribute("data-duration", String(dur));
          vid.setAttribute("data-media-start", String(Math.max(0, Number(v.mediaStart) || 0)));
          vid.style.objectPosition = v.focus;
          media.style.setProperty("--pv-origin", v.focus);

          var ui = q(".pv-ui");
          if (v.labelPos === "bottom") ui.classList.add("bottom");
          var label = q(".pv-label");
          var words = BM.empty(v.label) ? [] : BM.words(label, v.label);
          if (!words.length) label.remove();

          var tl = gsap.timeline({ paused: true });
          // cámara sobre el contenedor (nunca sobre el <video>): un solo movimiento, determinista
          var from = { scale: 1, yPercent: 0 }, to = { scale: 1, yPercent: 0 };
          if (v.move === "push-in") { from.scale = 1; to.scale = 1 + amt; }
          if (v.move === "pull-out") { from.scale = 1 + amt; to.scale = 1; }
          if (v.move === "pan-up") { from.scale = to.scale = 1 + amt; from.yPercent = amt * 30; to.yPercent = -amt * 30; }
          if (v.move === "pan-down") { from.scale = to.scale = 1 + amt; from.yPercent = -amt * 30; to.yPercent = amt * 30; }
          if (v.entry === "snap") {
            // golpe de zoom corto al entrar (energía del corte) que aterriza en el movimiento lento
            tl.fromTo(media, { scale: from.scale + 0.07, yPercent: from.yPercent }, { scale: from.scale, yPercent: from.yPercent, duration: BRAND.dur("enter") * 0.8, ease: BRAND.ease("emphasized") }, 0);
            tl.fromTo(media, { scale: from.scale, yPercent: from.yPercent }, { scale: to.scale, yPercent: to.yPercent, duration: Math.max(0.2, dur - BRAND.dur("enter") * 0.8), ease: "none", immediateRender: false }, BRAND.dur("enter") * 0.8);
          } else {
            tl.fromTo(media, from, Object.assign({ duration: dur, ease: "none" }, to), 0);
            if (v.entry === "fade") tl.fromTo(q(".pv-stage"), { opacity: 0 }, { opacity: 1, duration: BRAND.dur("enter"), ease: BRAND.ease("standard") }, 0);
          }
          if (label.isConnected) {
            tl.fromTo(label, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: BRAND.dur("enter"), ease: BRAND.ease("enter") }, 0.25);
            var acc = Array.prototype.slice.call(label.querySelectorAll(".bm-accent-word"));
            if (acc.length) BM.accentIn(tl, acc, 0.25 + BRAND.dur("enter"));
          }
          BM.exit(tl, q(".bm-frame"), dur - BRAND.dur("exit") - 0.05, v.exit);
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
