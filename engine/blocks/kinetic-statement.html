<!doctype html>
<!--
  bm-block: kinetic-statement
  Uso: una afirmación clave, palabra por palabra (hook, tesis, transición de argumento).
  Marcá la palabra de acento con *asteriscos* o en la variable "accent". Máximo ~12 palabras.
  Duración sugerida: BRAND.hold(texto) + 1.5 s (≈ 3.5-6 s).
-->
<html
  lang="es"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Afirmación (acento con *)","default":"⟦COMPLETAR: una *idea* por pantalla⟧","maxLength":120},
    {"id":"align","type":"enum","label":"Alineación","default":"center","options":[{"value":"center","label":"Centro"},{"value":"left","label":"Izquierda"}]},
    {"id":"size","type":"enum","label":"Tamaño","default":"h1","options":[{"value":"h1","label":"H1"},{"value":"hero","label":"Hero (≤5 palabras)"}]},
    {"id":"exit","type":"enum","label":"Salida","default":"fade","options":[{"value":"none","label":"Corte"},{"value":"fade","label":"Fade"},{"value":"up","label":"Hacia arriba"}]},
    {"id":"dur","type":"number","label":"Duración de la escena (s)","default":4.5,"min":1,"max":30,"step":0.1,"unit":"s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>kinetic-statement</title>
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; container-type: size; }
        #root .ks { display: flex; align-items: center; justify-content: center; }
        #root .ks.left { justify-content: flex-start; }
        #root .ks-text { max-width: 78cqw; text-align: center; }
        #root .ks.left .ks-text { text-align: left; }
        @container (orientation: portrait) { #root .ks-text { max-width: 100%; } }
      </style>
      <div id="root" data-composition-id="__ID__">
        <div class="bm-frame">
          <div class="bm-bg grid"></div>
          <div class="bm-safe ks">
            <h2 class="ks-text"></h2>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = BM.vars({ text: "", align: "center", size: "h1", exit: "fade", dur: 4.5 }, window.__hyperframes);
          var box = root.querySelector(".ks");
          if (v.align === "left") box.classList.add("left");
          var h = root.querySelector(".ks-text");
          h.classList.add(v.size === "hero" ? "bm-hero" : "bm-h1");
          var words = BM.words(h, v.text, v.accent);
          var accents = Array.prototype.slice.call(h.querySelectorAll(".bm-accent-word"));

          var tl = gsap.timeline({ paused: true });
          BM.revealWords(tl, words, 0.2);
          var done = 0.2 + BRAND.dur("short") * 1.6 + (words.length - 1) * BRAND.stagger("words");
          if (accents.length) {
            // el acento llega DESPUÉS de que se leyó la frase: un solo beat de énfasis
            tl.fromTo(accents, { color: BRAND.color("text") }, { color: BRAND.color("accent"), duration: BRAND.dur("short"), ease: BRAND.ease("standard") }, done + 0.15);
            tl.fromTo(accents, { scale: 1 }, { scale: 1.06, duration: BRAND.dur("micro"), ease: BRAND.ease("standard"), yoyo: true, repeat: 1, transformOrigin: "50% 70%" }, done + 0.15);
          }
          BM.exit(tl, h, Number(v.dur) - BRAND.dur("exit") - 0.05, v.exit);
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
